<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi perfil · La Verdu</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: { 50:'#ecfdf5', 100:'#d1fae5', 200:'#a7f3d0', 300:'#6ee7b7', 400:'#34d399', 500:'#10b981', 600:'#059669', 700:'#047857', 800:'#065f46', 900:'#064e3b' }, accent: { 500:'#84cc16', 600:'#65a30d' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="profileHeader" class="card p-6 mb-6"></div>

    <div class="grid md:grid-cols-4 gap-6">
      <aside class="md:col-span-1 h-fit card p-2">
        <button data-tab="pedidos" class="w-full text-left px-4 py-3 rounded-lg font-semibold border-b-2 border-primary-600 text-primary-700">
          📦 Mis pedidos
        </button>
        <button data-tab="datos" class="w-full text-left px-4 py-3 rounded-lg font-semibold border-b-2 border-transparent text-slate-500 hover:bg-slate-50">
          👤 Datos personales
        </button>
        <button data-tab="resenas" class="w-full text-left px-4 py-3 rounded-lg font-semibold border-b-2 border-transparent text-slate-500 hover:bg-slate-50">
          ⭐ Mis reseñas
        </button>
      </aside>

      <div class="md:col-span-3">
        <div id="panel-pedidos" class="card p-6">
          <h2 class="text-xl font-bold text-slate-800 mb-4">Historial de pedidos</h2>
          <div id="pedidosList"></div>
        </div>

        <div id="panel-datos" class="card p-6 hidden">
          <h2 class="text-xl font-bold text-slate-800 mb-4">Datos personales</h2>
          <div id="datosPersonales"></div>
        </div>

        <div id="panel-resenas" class="card p-6 hidden">
          <h2 class="text-xl font-bold text-slate-800 mb-4">Mis reseñas</h2>
          <div id="resenasList"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/perfil.js"></script>
</body>
</html>
