<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse · La Verdu</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: { 50:'#ecfdf5', 100:'#d1fae5', 200:'#a7f3d0', 300:'#6ee7b7', 400:'#34d399', 500:'#10b981', 600:'#059669', 700:'#047857', 800:'#065f46', 900:'#064e3b' }, accent: { 500:'#84cc16', 600:'#65a30d' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="max-w-2xl mx-auto px-4 py-12">
    <div class="card p-8">
      <div class="text-center mb-6">
        <img src="assets/logo.svg" class="h-12 w-12 mx-auto mb-3">
        <h1 class="text-2xl font-extrabold text-slate-900">Crear cuenta</h1>
        <p class="text-slate-600 text-sm mt-1">Empezá a comprar productos frescos hoy mismo</p>
      </div>

      <form id="registroForm" class="space-y-4">
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="label">Nombre *</label>
            <input name="nombre" type="text" required class="input">
          </div>
          <div>
            <label class="label">Apellido</label>
            <input name="apellido" type="text" class="input">
          </div>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="label">Email *</label>
            <input name="email" type="email" required class="input">
          </div>
          <div>
            <label class="label">Teléfono</label>
            <input name="telefono" type="tel" class="input">
          </div>
        </div>
        <div class="grid md:grid-cols-2 gap-4">
          <div>
            <label class="label">Contraseña * <span class="text-slate-400 text-xs">(mín. 6 caracteres)</span></label>
            <input name="password" type="password" minlength="6" required class="input">
          </div>
          <div>
            <label class="label">Confirmar contraseña *</label>
            <input name="password2" type="password" minlength="6" required class="input">
          </div>
        </div>

        <div class="border-t border-slate-200 pt-4">
          <p class="text-sm font-semibold text-slate-700 mb-3">Dirección (opcional, podés completarla después)</p>
          <div class="grid md:grid-cols-6 gap-4">
            <div class="md:col-span-4">
              <label class="label">Calle</label>
              <input name="calle" type="text" class="input">
            </div>
            <div class="md:col-span-2">
              <label class="label">Número</label>
              <input name="numero" type="text" class="input">
            </div>
            <div class="md:col-span-2">
              <label class="label">Código Postal</label>
              <input name="cp" type="text" class="input">
            </div>
            <div class="md:col-span-2">
              <label class="label">Ciudad</label>
              <input name="ciudad" type="text" class="input">
            </div>
            <div class="md:col-span-2">
              <label class="label">Provincia</label>
              <input name="provincia" type="text" class="input">
            </div>
          </div>
        </div>

        <label class="flex items-start gap-2 text-sm text-slate-600">
          <input type="checkbox" required class="mt-1 text-primary-600 focus:ring-primary-500 rounded">
          <span>Acepto los <a href="terminos-condiciones.html" class="text-primary-600 underline">términos y condiciones</a> y la <a href="politicas-privacidad.html" class="text-primary-600 underline">política de privacidad</a></span>
        </label>

        <button type="submit" class="btn-primary w-full">Crear cuenta</button>
      </form>

      <p class="text-center text-sm text-slate-600 mt-6">
        ¿Ya tenés cuenta? <a href="login.html" class="text-primary-600 font-semibold hover:underline">Ingresá</a>
      </p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/auth.js"></script>
</body>
</html>
