<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout · La Verdu</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: { 50:'#ecfdf5', 100:'#d1fae5', 200:'#a7f3d0', 300:'#6ee7b7', 400:'#34d399', 500:'#10b981', 600:'#059669', 700:'#047857', 800:'#065f46', 900:'#064e3b' }, accent: { 500:'#84cc16', 600:'#65a30d' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h1 class="text-3xl font-extrabold text-slate-900 mb-6">Finalizar compra</h1>

    <div id="checkoutContent">
      <form id="checkoutForm" class="grid lg:grid-cols-3 gap-6">
        <!-- LEFT -->
        <div class="lg:col-span-2 space-y-6">
          <!-- Datos contacto -->
          <div class="card p-6">
            <h2 class="text-lg font-bold text-slate-800 mb-4">📋 Datos de contacto</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="label">Nombre completo *</label>
                <input id="nombre" name="nombre" type="text" required class="input">
              </div>
              <div>
                <label class="label">Teléfono *</label>
                <input id="telefono" name="telefono" type="tel" required class="input">
              </div>
              <div class="md:col-span-2">
                <label class="label">Email *</label>
                <input id="email" name="email" type="email" required class="input">
              </div>
            </div>
          </div>

          <!-- Dirección -->
          <div class="card p-6">
            <h2 class="text-lg font-bold text-slate-800 mb-4">📍 Dirección de envío</h2>
            <div class="grid grid-cols-1 md:grid-cols-6 gap-4">
              <div class="md:col-span-4">
                <label class="label">Calle *</label>
                <input id="calle" name="calle" type="text" required class="input">
              </div>
              <div class="md:col-span-2">
                <label class="label">Número *</label>
                <input id="numero" name="numero" type="text" required class="input">
              </div>
              <div class="md:col-span-2">
                <label class="label">Piso</label>
                <input id="piso" name="piso" type="text" class="input">
              </div>
              <div class="md:col-span-2">
                <label class="label">Departamento</label>
                <input id="depto" name="depto" type="text" class="input">
              </div>
              <div class="md:col-span-2">
                <label class="label">Código Postal *</label>
                <input id="cp" name="cp" type="text" required class="input">
              </div>
              <div class="md:col-span-3">
                <label class="label">Ciudad *</label>
                <input id="ciudad" name="ciudad" type="text" required class="input">
              </div>
              <div class="md:col-span-3">
                <label class="label">Provincia *</label>
                <select id="provincia" name="provincia" required class="input">
                  <option value="">Seleccionar</option>
                  <option>Buenos Aires</option>
                  <option>CABA</option>
                  <option>Córdoba</option>
                  <option>Santa Fe</option>
                  <option>Mendoza</option>
                  <option>Tucumán</option>
                  <option>Otra</option>
                </select>
              </div>
              <div class="md:col-span-6">
                <label class="label">Notas para el envío (opcional)</label>
                <textarea name="notas" rows="2" class="input" placeholder="Ej: timbre roto, llamar por teléfono..."></textarea>
              </div>
            </div>
          </div>

          <!-- Tipo de envío -->
          <div class="card p-6">
            <h2 class="text-lg font-bold text-slate-800 mb-4">🚚 Tipo de envío</h2>
            <div class="space-y-3">
              <label class="flex items-start gap-3 p-4 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 has-[:checked]:border-primary-500 has-[:checked]:bg-primary-50">
                <input type="radio" name="envio" value="standard" checked class="mt-1 text-primary-600 focus:ring-primary-500">
                <div class="flex-1">
                  <p class="font-semibold text-slate-800">Envío Standard · 3-5 días hábiles</p>
                  <p class="text-sm text-slate-600">Envío gratis en compras &gt; $5.000, sino $1.500</p>
                </div>
              </label>
              <label class="flex items-start gap-3 p-4 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 has-[:checked]:border-primary-500 has-[:checked]:bg-primary-50">
                <input type="radio" name="envio" value="express" class="mt-1 text-primary-600 focus:ring-primary-500">
                <div class="flex-1">
                  <p class="font-semibold text-slate-800">Envío Express · 24-48 hs</p>
                  <p class="text-sm text-slate-600">$2.500</p>
                </div>
              </label>
              <label class="flex items-start gap-3 p-4 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 has-[:checked]:border-primary-500 has-[:checked]:bg-primary-50">
                <input type="radio" name="envio" value="retiro" class="mt-1 text-primary-600 focus:ring-primary-500">
                <div class="flex-1">
                  <p class="font-semibold text-slate-800">Retiro en tienda</p>
                  <p class="text-sm text-slate-600">Gratis · L-V 8-20, S 8-20, D 9-13</p>
                </div>
              </label>
            </div>
          </div>

          <!-- Medio de pago -->
          <div class="card p-6">
            <h2 class="text-lg font-bold text-slate-800 mb-4">💳 Medio de pago</h2>
            <div class="space-y-3">
              <label class="flex items-start gap-3 p-4 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 has-[:checked]:border-primary-500 has-[:checked]:bg-primary-50">
                <input type="radio" name="pago" value="cash" checked class="mt-1 text-primary-600 focus:ring-primary-500">
                <div class="flex-1">
                  <p class="font-semibold text-slate-800">Efectivo contra entrega <span class="badge bg-emerald-100 text-emerald-700 ml-2">10% off</span></p>
                  <p class="text-sm text-slate-600">Pagás al recibir tu pedido. Incluye 10% de descuento.</p>
                </div>
              </label>
              <label class="flex items-start gap-3 p-4 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 has-[:checked]:border-primary-500 has-[:checked]:bg-primary-50">
                <input type="radio" name="pago" value="transfer" class="mt-1 text-primary-600 focus:ring-primary-500">
                <div class="flex-1">
                  <p class="font-semibold text-slate-800">Transferencia bancaria</p>
                  <p class="text-sm text-slate-600">Te enviaremos los datos una vez confirmado.</p>
                </div>
              </label>
              <label class="flex items-start gap-3 p-4 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 has-[:checked]:border-primary-500 has-[:checked]:bg-primary-50">
                <input type="radio" name="pago" value="tarjeta" class="mt-1 text-primary-600 focus:ring-primary-500">
                <div class="flex-1">
                  <p class="font-semibold text-slate-800">Tarjeta de crédito/débito</p>
                  <p class="text-sm text-slate-600">Visa, Mastercard, Cabal, Naranja.</p>
                </div>
              </label>
            </div>

            <!-- Detalle tarjeta -->
            <div data-pago-detail="tarjeta" class="hidden mt-4 p-4 bg-slate-50 rounded-lg space-y-3">
              <div>
                <label class="label">Titular *</label>
                <input name="titular" type="text" class="input">
              </div>
              <div>
                <label class="label">Número de tarjeta *</label>
                <input name="tarjeta" type="text" maxlength="19" placeholder="0000 0000 0000 0000" class="input">
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="label">Vencimiento *</label>
                  <input name="vencimiento" type="text" maxlength="5" placeholder="MM/AA" class="input">
                </div>
                <div>
                  <label class="label">CVV *</label>
                  <input name="cvv" type="text" maxlength="4" placeholder="000" class="input">
                </div>
              </div>
              <p class="text-xs text-slate-500">🔒 Modo demo: no se procesarán datos reales.</p>
            </div>
          </div>
        </div>

        <!-- RIGHT -->
        <aside class="lg:col-span-1 h-fit card p-6 space-y-4 lg:sticky lg:top-20">
          <h3 class="font-bold text-lg text-slate-800">Tu pedido</h3>
          <div id="summaryItems" class="max-h-72 overflow-y-auto"></div>
          <div class="border-t border-slate-200 pt-3 space-y-2 text-sm">
            <div class="flex justify-between"><span class="text-slate-600">Subtotal</span><span id="subtotalLabel" class="font-semibold">$0</span></div>
            <div id="descuentoRow" class="hidden flex justify-between"><span class="text-emerald-600">Cupón</span><span id="descuentoLabel" class="font-semibold text-emerald-600"></span></div>
            <div id="cashRow" class="hidden flex justify-between"><span class="text-emerald-600">Descuento efectivo</span><span id="cashLabel" class="font-semibold text-emerald-600"></span></div>
            <div class="flex justify-between"><span class="text-slate-600">Envío</span><span id="envioLabel" class="font-semibold">$0</span></div>
          </div>
          <div class="border-t border-slate-200 pt-3 flex justify-between items-center">
            <span class="text-lg font-bold text-slate-800">Total</span>
            <span id="totalLabel" class="text-2xl font-extrabold text-primary-600">$0</span>
          </div>
          <button type="submit" class="btn-primary w-full">Confirmar compra</button>
          <p class="text-xs text-slate-500 text-center">Al confirmar, aceptás nuestros <a href="terminos-condiciones.html" class="underline">términos y condiciones</a>.</p>
        </aside>
      </form>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/checkout.js"></script>
</body>
</html>
