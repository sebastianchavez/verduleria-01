<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos · La Verdu</title>
  <meta name="description" content="Catálogo completo de frutas, verduras y productos frescos.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: { 50:'#ecfdf5', 100:'#d1fae5', 200:'#a7f3d0', 300:'#6ee7b7', 400:'#34d399', 500:'#10b981', 600:'#059669', 700:'#047857', 800:'#065f46', 900:'#064e3b' }, accent: { 500:'#84cc16', 600:'#65a30d' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900">Nuestros productos</h1>
      <p class="mt-2 text-slate-600">Frutas, verduras y productos frescos seleccionados para vos</p>
    </div>

    <!-- Search & sort -->
    <div class="flex flex-col md:flex-row gap-3 mb-6">
      <div class="relative flex-1">
        <input id="searchInput" type="search" placeholder="Buscar productos..." class="input pl-10">
        <svg class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
      </div>
      <select id="sortSelect" class="input md:w-56">
        <option value="nombre-asc">Ordenar: Nombre A→Z</option>
        <option value="precio-asc">Precio: menor a mayor</option>
        <option value="precio-desc">Precio: mayor a menor</option>
        <option value="rating">Mejor valorados</option>
      </select>
    </div>

    <div class="grid lg:grid-cols-4 gap-6">
      <!-- Filtros sidebar -->
      <aside class="lg:col-span-1 h-fit card p-4 lg:sticky lg:top-20">
        <h3 class="font-bold text-slate-800 mb-3">Categorías</h3>
        <div id="catFiltro" class="space-y-1 mb-4"></div>

        <h3 class="font-bold text-slate-800 mb-3 border-t border-slate-200 pt-4">Tipo</h3>
        <label class="flex items-center gap-2 cursor-pointer hover:bg-slate-50 p-2 rounded-lg mb-3">
          <input id="organicoCheck" type="checkbox" class="text-primary-600 focus:ring-primary-500 rounded">
          <span class="text-sm">🌱 Solo orgánicos</span>
        </label>

        <h3 class="font-bold text-slate-800 mb-3 border-t border-slate-200 pt-4">Precio máximo</h3>
        <input id="precioMax" type="range" min="0" max="10000" step="500" value="10000" class="w-full accent-primary-600">
        <div class="flex justify-between text-xs text-slate-500 mt-1">
          <span>$0</span>
          <span id="precioMaxLabel" class="font-semibold text-primary-600">$10.000</span>
        </div>
      </aside>

      <!-- Listado -->
      <div class="lg:col-span-3">
        <div class="flex items-center justify-between mb-4">
          <p id="resultCount" class="text-slate-600 text-sm"></p>
        </div>
        <div id="productosGrid" class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6"></div>
        <div id="emptyState" class="hidden text-center py-16">
          <div class="text-6xl mb-3">🔍</div>
          <h3 class="font-bold text-slate-800 mb-1">No encontramos productos</h3>
          <p class="text-slate-600">Probá con otros filtros o términos de búsqueda.</p>
        </div>
        <div id="pagination" class="flex flex-wrap justify-center gap-2 mt-8"></div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/productos.js"></script>
</body>
</html>
