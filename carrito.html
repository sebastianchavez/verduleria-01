<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito · La Verdu</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: { 50:'#ecfdf5', 100:'#d1fae5', 200:'#a7f3d0', 300:'#6ee7b7', 400:'#34d399', 500:'#10b981', 600:'#059669', 700:'#047857', 800:'#065f46', 900:'#064e3b' }, accent: { 500:'#84cc16', 600:'#65a30d' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="navbar"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <h1 class="text-3xl font-extrabold text-slate-900 mb-6">Mi carrito</h1>

    <!-- Empty -->
    <div id="emptyState" class="hidden text-center py-16 card">
      <div class="text-6xl mb-4">🛒</div>
      <h2 class="text-xl font-bold text-slate-800 mb-2">Tu carrito está vacío</h2>
      <p class="text-slate-600 mb-6">¡Empezá a agregar productos frescos!</p>
      <a href="productos.html" class="btn-primary">Ver productos</a>
    </div>

    <!-- Content -->
    <div id="cartContent" class="grid lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 card overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full">
            <thead class="bg-slate-50 text-xs text-slate-600 uppercase">
              <tr>
                <th class="text-left px-4 py-3">Producto</th>
                <th class="text-center px-4 py-3">Cantidad</th>
                <th class="text-right px-4 py-3">Subtotal</th>
              </tr>
            </thead>
            <tbody id="cartItems" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

      <aside class="lg:col-span-1 h-fit card p-6 space-y-4 lg:sticky lg:top-20">
        <h3 class="font-bold text-lg text-slate-800">Resumen</h3>

        <!-- Cupón -->
        <div>
          <label class="label">Cupón de descuento</label>
          <div class="flex gap-2">
            <input id="cuponInput" type="text" placeholder="VERDE10" class="input uppercase">
            <button id="applyCuponBtn" class="btn-secondary">Aplicar</button>
          </div>
          <p class="text-xs text-slate-500 mt-1">Probá <code class="bg-slate-100 px-1 rounded">VERDE10</code> o <code class="bg-slate-100 px-1 rounded">FRESCO15</code></p>
          <div id="cuponAplicado" class="hidden mt-2 bg-emerald-50 border border-emerald-200 rounded-lg p-3 flex items-center justify-between text-sm">
            <span class="text-emerald-800" id="cuponText"></span>
            <button id="quitarCuponBtn" class="text-red-600 hover:underline text-xs">Quitar</button>
          </div>
        </div>

        <div class="border-t border-slate-200 pt-4 space-y-2 text-sm">
          <div class="flex justify-between"><span class="text-slate-600">Subtotal</span><span id="subtotalLabel" class="font-semibold">$0</span></div>
          <div id="descuentoRow" class="hidden flex justify-between"><span class="text-emerald-600">Descuento</span><span id="descuentoLabel" class="font-semibold text-emerald-600"></span></div>
          <div class="flex justify-between"><span class="text-slate-600">Envío</span><span id="envioLabel" class="font-semibold">$0</span></div>
          <p class="text-xs text-slate-500">Envío gratis en compras &gt; $5.000</p>
        </div>

        <div class="border-t border-slate-200 pt-4 flex justify-between items-center">
          <span class="text-lg font-bold text-slate-800">Total</span>
          <span id="totalLabel" class="text-2xl font-extrabold text-primary-600">$0</span>
        </div>

        <a href="checkout.html" class="btn-primary w-full">Ir a checkout</a>
        <a href="productos.html" class="block text-center text-sm text-slate-600 hover:text-primary-600">← Seguir comprando</a>
      </aside>
    </div>
  </main>

  <div id="footer"></div>

  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/reviews.js"></script>
  <script src="js/orders.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages/carrito.js"></script>
</body>
</html>
